services:

  mongo:
    image: mongo:7
    container_name: core-mongo
    command:
      - "--replSet"
      - "rs0"
      - "--bind_ip_all"
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - core-net

  mongo-init:
    image: mongo:7
    container_name: core-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - >
        until mongosh
        --host mongo:27017
        --quiet
        --eval
        'try {
          if (rs.status().myState !== 1) {
            quit(3)
          }
        } catch (e) {
          try {
            rs.initiate()
          } catch (e2) {}
          quit(3)
        }'
        >/dev/null 2>&1;
        do
          sleep 2;
        done
    networks:
      - core-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: core-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        PLAINTEXT://:9092,
        INTERNAL://:19092,
        CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://localhost:9092,
        INTERNAL://kafka:19092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        INTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    networks:
      - core-net

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: core-zipkin
    ports:
      - "9411:9411"
    networks:
      - core-net

volumes:
  mongo-data:
  
networks:
  core-net:
    driver: bridge